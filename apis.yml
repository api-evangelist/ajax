name: Ajax
description: >-
  Ajax is an AI-powered timekeeping platform built specifically for law firms.
  It automatically captures attorney work across applications, documents, emails,
  phone calls, and video meetings, then generates OCG-compliant, voice-matched
  time-entry narratives and syncs them with one click to practice-management and
  billing systems. Ajax integrates with SurePoint, Clio, MyCase, Filevine,
  PracticePanther, Centerbase, Actionstep, and Soluno, and positions itself
  around recovering otherwise-lost billable hours. The company is SOC 2 aligned,
  encrypts data in transit and at rest, does not train models on customer data,
  and enforces rolling data deletion. Ajax is a Bloomberg Beta portfolio company.
  As of this enrichment pass it exposes no public developer API, SDKs, or
  documentation surface — it is a product/SaaS company profile rather than an API
  provider.
